<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>NestJS Page</title>
  <style>
    body {
      margin: 0;
      font-family: Arial;
      background: linear-gradient(135deg, #667eea, #764ba2);
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      color: white;
    }

    .box {
      text-align: center;
      background: rgba(255,255,255,0.1);
      padding: 40px;
      border-radius: 10px;
    }

    button {
      padding: 10px 20px;
      border: none;
      background: orange;
      color: white;
      cursor: pointer;
    }

    #result {
      margin-top: 20px;
    }
  </style>
</head>
<body>

<div class="box">
  <h1>NestJS Page 🚀</h1>
  <button onclick="getData()">Call API</button>
  <div id="result"></div>
</div>

<script>
async function getData() {
  const res = await fetch('/api');
  const data = await res.text();
  document.getElementById('result').innerText = data;
}
</script>

</body>
</html>
